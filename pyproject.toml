[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillvet"
version = "0.1.0"
description = "Vet AI agent skills, MCP configs and agent files before you install them — one command, trust score included."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "skillvet contributors" }]
keywords = ["ai-agents", "security", "claude-code", "mcp", "skills", "scanner"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
skillvet = "skillvet.cli:main"

[tool.setuptools.packages.find]
include = ["skillvet*"]
